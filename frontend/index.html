<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Queue Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <main style="font-family: system-ui, sans-serif; padding: 24px;">
        <h1>Loading SmartQueue...</h1>
        <p id="startup-status">Waiting for the React app bundle.</p>
      </main>
    </div>
    <script>
      window.showStartupFailure = function (message) {
        var status = document.getElementById('startup-status');
        if (status) {
          status.textContent = message;
        }
      };

      window.addEventListener('error', function (event) {
        window.showStartupFailure('Frontend startup error: ' + (event.message || 'Unknown script error.'));
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = reason && (reason.message || String(reason));
        window.showStartupFailure('Frontend startup error: ' + (message || 'Unknown promise rejection.'));
      });

      window.setTimeout(function () {
        if (!window.__SMARTQUEUE_REACT_STARTED__) {
          var currentUrl = window.location.href;
          var expectedUrl = 'http://localhost:5173/login';
          var message = window.location.protocol === 'file:'
            ? 'This file was opened directly. Start the frontend with npm run dev and open ' + expectedUrl + '.'
            : 'React did not start from this page: ' + currentUrl + '. Start the frontend with npm run dev and open ' + expectedUrl + '.';
          window.showStartupFailure(message);
        }
      }, 3000);
    </script>
    <script type="module">
      import('/src/main.tsx').catch(function (error) {
        var message = error && (error.message || String(error));
        window.showStartupFailure('Frontend startup error: ' + (message || 'Unable to load /src/main.tsx'));
      });
    </script>
  </body>
</html>
