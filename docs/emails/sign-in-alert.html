<!--
  Reference only — already wired into the backend (EmailService.sendSignInNotification).
  Nothing to paste anywhere; this file just shows what gets sent.
  Sent when: a user or admin signs in (password, OTP, or Google), on every sign-in after the first.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New sign-in detected</title>
<style>
  body { margin:0; padding:0; background:#f4f4f5; font-family: Arial, Helvetica, sans-serif; }
  table { border-collapse: collapse; }
  .container { width:100%; max-width:600px; margin:0 auto; }
  .header { background:#09090b; padding:28px 32px; text-align:center; }
  .brand { font-size:22px; font-weight:bold; color:#fafafa; letter-spacing:-0.5px; }
  .brand span { color:#10b981; }
  .card { background:#ffffff; padding:40px 32px; }
  .heading { font-size:20px; font-weight:bold; color:#111111; margin:0 0 16px; }
  .body-text { font-size:15px; line-height:1.6; color:#3f3f46; margin:0 0 28px; }
  .btn { display:inline-block; background:#10b981; color:#ffffff !important; text-decoration:none; font-weight:bold; font-size:15px; padding:14px 28px; border-radius:8px; }
  .footer { padding:24px 32px; text-align:center; font-size:12px; color:#a1a1aa; }
  .footer a { color:#a1a1aa; }
  @media only screen and (max-width: 480px) {
    .card { padding:28px 20px !important; }
    .header { padding:22px 20px !important; }
    .heading { font-size:18px !important; }
    .btn { display:block !important; text-align:center !important; }
  }
</style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td>
    <table role="presentation" class="container" cellpadding="0" cellspacing="0" align="center">
      <tr><td class="header">
        <span class="brand">Smart<span>Queue</span></span>
      </td></tr>
      <tr><td class="card">
        <p class="heading">New sign-in detected</p>
        <p class="body-text">Hi {{name}}, we noticed a new sign-in to your Smart Queue account. If this wasn't you, please reset your password right away.</p>
        <p style="text-align:center; margin:0;">
          <a class="btn" href="https://smart-queue.in/login">Secure My Account</a>
        </p>
      </td></tr>
      <tr><td class="footer">
        SmartQueue &middot; <a href="https://smart-queue.in">smart-queue.in</a><br>Queues, made invisible.
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
